<script>
let quantConv = window.prompt("Digite o número de convidados");

let carne = 300;
let quantCarne = (6/100)*300;
let bebida = 3 + 9;
let doce = 1;
let totalCarne = quantConv * quantCarne;
let totalBebida = quantConv * bebida;
let totalDoces = quantConv * doce;


if(quantConv < 50){
    console.log("Número insulficiente de convidados para contratar o buffet.")
}


else{
    console.log("Número suficiente de convidados para contratar o buffet.")



{
if(quantConv*quantCarne && quantConv*bebida && quantConv * doce)(
    console.log("A quantidade em quilogramas(Kg) de carne é igual a", totalCarne,"kg"))
    console.log("A quantidade de bebidas disponíveis no buffet é igual a", totalBebida,"latas");
    console.log("A quantidade de doces disponíveis no buffet é igual a", totalDoces);
if(quantConv <= 100)(
    console.log("Evento pequeno")
);
else if(quantConv> 100 && quantConv <= 200)(
    console.log("Evento médio")
);
else{
    console.log("Evento grande")
};
};}

</script>

    <h1 align="center" color="white">Contratação</h1>
    <figure align="justify">
    <p>O contrato necessita dos seguintes tópicos:</p>
    <ol>
      <li>idade mínima de convidados O buffet só aceita eventos com no mínimo
50 pessoas.  </li>

     <p>O consumo por pessoa será definido da seguinte forma:</p>
      <li>Cada convidado consome, em média:
• 300 gramas de carne 3 latas de refrigerante 1 doce</li>
      <p>Para a margem de segurança, é definido</p>
      <li>Para evitar falta de produtos:
• Acrescentar 6% a mais de carne  
• Acrescentar 9 latas extras de refrigerante (total)  
• Para doces: não há margem (1 por pessoa)</li>

<p>E a classificação do evento será de acordo com a quantidade de convidados presentes no dia, sendo definido por:</p>
  <li>• Até 100 pessoas: Evento pequeno
• De 101 até 200: Evento médio  
• Acima de 200: Evento grande</li>
    </ol>
